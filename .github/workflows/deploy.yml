name: Đẩy luật bảo mật Firestore lên Firebase (bấm tay)
on:
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install -g firebase-tools@13.29.1
      - name: Ghi khoá service account
        run: echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}' > "$RUNNER_TEMP/sa.json"
      # Gói Spark không có Storage (từ 03/02/2026 phải lên Blaze), web chạy trên GitHub Pages nên chỉ đẩy luật Firestore.
      - name: Deploy luật bảo mật Firestore
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/sa.json
        run: firebase deploy --only firestore:rules --project "${{ secrets.FIREBASE_PROJECT_ID }}" --non-interactive
